[build-system]
requires = ["setuptools>=70.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["exeplot"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
  'pragma: no cover',
  'if.*?__name__.*?==.*?.__main__.:',
  'def main\(\)\:',
  'except:',
  'except ImportError:',
  'except NameError:',
  'except (AttributeError, TypeError):',
  'raise NotImplementedError',
  'def _setup(parser):',
  'def configure():',
  'def byte_differences\(bytes1, bytes2\):',
  '# blocks skipped ; no testing required (done manually)',
  '''if kw.get\('interactive_mode', False\):''',
  'if self.type not in ["ELF", "MachO", "PE"]:',
  'if j <= i or start2 is None:',
  'if s != self.__size:',
  '''glob['_IMP'] = True''',
]

[tool.setuptools.dynamic]
version = {attr = "exeplot.__info__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt"]

[project]
name = "exeplot"
authors = [
  {name="Alexandre D'Hondt", email="alexandre.dhondt@gmail.com"},
]
description = "Library for plotting executable samples supporting multiple formats"
license = {file = "LICENSE"}
keywords = ["python", "development", "programming", "executable-samples", "plot", "entropy", "cfg"]
requires-python = ">=3.10,<4"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "lief>=0.16.1",
  "matplotlib",
]
dynamic = ["version"]

[project.optional-dependencies]
graph = [
  "angr>=9.2",
  # angr 9.2.x (last release for Python<3.12) does not pin these, while angr 10 does
  "bitstring<5; python_version<'3.12'",
  "pycparser<3.12; python_version<'3.12'",
  "networkx>=3.4.2",
  "numpy",
  "pygraphviz>=1.14",
  "scipy",
  "unicorn>2",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
documentation = "https://python-exeplot.readthedocs.io/en/latest/?badge=latest"
homepage = "https://github.com/packing-box/python-exeplot"
issues = "https://github.com/packing-box/python-exeplot/issues"
repository = "https://github.com/packing-box/python-exeplot"

[project.scripts]
exeplot = "exeplot.__main__:main"
